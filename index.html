<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Björnö Slott Garden Inventory</title>
    <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="site-header">
        <img
          class="site-logo"
          src="/assets/bjornoslott-garden-logo.svg"
          alt="Björnö Slott Garden"
        />
      </header>

      <section
        class="map-section"
        aria-label="Garden map with plant markers"
        aria-describedby="map-instructions"
      >
        <p class="visually-hidden" id="map-instructions">
          Click any marker on the map to view plant or tree details. Pan and zoom
          with your mouse or touch, and review the selected item in the overlay.
        </p>
        <div class="map-frame">
          <div class="map" id="map" role="application" aria-label="Interactive garden map"></div>
          <aside class="selection-overlay" aria-live="polite">
            <h2>Selected plant/tree</h2>
            <div id="selection">
              Click a marker to view planted timestamp, location and details.
            </div>
          </aside>
        </div>
      </section>

      <section>
        <h2>Inventory</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Planted timestamp</th>
              <th>Location</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="inventory-body"></tbody>
        </table>
      </section>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
    <script src="script.js"></script>
  </body>
</html>
