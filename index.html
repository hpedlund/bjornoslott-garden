<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e2b20" />
    <title>Björnö Slott Garden Inventory</title>
    <link href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="site-header">
        <h1 class="site-title">Björnö Slott Garden</h1>
      </header>

      <section
        class="map-section"
        aria-label="Garden map with plant markers"
        aria-describedby="map-instructions"
      >
        <div class="timeline-controls">
          <label for="year-select">Map year</label>
          <select id="year-select" aria-label="Select map year"></select>
        </div>
        <p class="visually-hidden" id="map-instructions">
          Click any marker on the map to view plant or tree details in a popup.
          Pan and zoom with your mouse or touch and choose a map year to see
          time progression.
        </p>
        <div class="map-frame">
          <div class="map" id="map" role="application" aria-label="Interactive garden map"></div>
        </div>
      </section>

      <section>
        <h2>Inventory</h2>
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Type</th>
              <th>Year</th>
              <th>Area</th>
              <th>Location</th>
              <th>Details</th>
            </tr>
          </thead>
          <tbody id="inventory-body"></tbody>
        </table>
      </section>
    </main>
    <script src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
    <script src="script.js"></script>
  </body>
</html>
